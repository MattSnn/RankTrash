<!--
  Modelo de e-mail de login do RankTrash (só código, sem link).
  Cole em: Supabase → Authentication → Email Templates → "Magic Link" E "Confirm signup".
  Assunto sugerido: Seu código RankTrash: {{ .Token }}
-->
<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;padding:0;background:#1f3a9e;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#1f3a9e;padding:24px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#3d8fd1;border:4px solid #0a0f1f;">
            <tr>
              <td style="padding:10px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0b1e3a;border:4px solid #0a0f1f;">
                  <tr>
                    <td align="center" style="padding:28px 20px 8px;">
                      <img src="https://ranktrash.eco.br/icons/icon-192.png" width="72" height="72" alt="RankTrash" style="display:block;border:0;image-rendering:pixelated;" />
                    </td>
                  </tr>
                  <tr>
                    <td align="center" style="padding:6px 20px 0;font-family:'Courier New',Courier,monospace;font-size:20px;font-weight:bold;letter-spacing:3px;color:#e8f1ff;">
                      RANKTRASH
                    </td>
                  </tr>
                  <tr>
                    <td align="center" style="padding:18px 24px 6px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:22px;color:#8fb2d9;">
                      Seu código para entrar no app:
                    </td>
                  </tr>
                  <tr>
                    <td align="center" style="padding:8px 20px 8px;">
                      <div style="display:inline-block;background:#fde8b0;border:4px solid #0a0f1f;padding:14px 22px;font-family:'Courier New',Courier,monospace;font-size:36px;font-weight:bold;letter-spacing:10px;color:#0a0f1f;">
                        {{ .Token }}
                      </div>
                    </td>
                  </tr>
                  <tr>
                    <td align="center" style="padding:14px 28px 26px;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:20px;color:#8fb2d9;">
                      Digite o código no RankTrash. Ele vale por 1 hora e só pode ser usado uma vez.<br />
                      Se não foi você, ignore este e-mail.
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
          <p style="margin:14px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#c7d3f0;">
            ranktrash.eco.br · Facens Lixo Zero
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>RankTrash · Video Pitch</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1920" height="1080"></canvas>
  <div id="scenes"></div>
  <div id="hud">
    <div class="hud-brand"><span class="hud-dot"></span>RANKTRASH <i>·</i> FACENS LIXO ZERO</div>
    <div class="hud-chapter"><span id="chapNum">00</span><b id="chapName"></b></div>
    <div class="hud-corner tl"></div><div class="hud-corner tr"></div><div class="hud-corner bl"></div><div class="hud-corner br"></div>
    <div class="hud-progress"><i id="prog"></i></div>
  </div>
  <div id="caption"><span id="capText"></span></div>
  <canvas id="wipe" width="1920" height="1080"></canvas>
  <div id="fade"></div>
</div>
<script src="assets/icons.js"></script>
<script src="assets/narration.js"></script>
<script src="comp.js"></script>
</body>
</html>
